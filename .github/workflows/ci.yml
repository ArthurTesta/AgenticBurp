name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast tier: runs on every push/PR. Installs the pinned lock and runs the full
  # unittest suite -- which now includes the end-to-end detection smoke test
  # (harness/test_smoke_detection.py, SESSION_4_PLAN.md T1.1). If detection
  # regresses to zero, this tier goes red even though the mocked tests pass.
  #
  # windows-latest + Python 3.14 match the environment the lock was frozen from
  # (the project runs on Windows); pin the lock, not a floating resolve.
  fast:
    name: Fast tier (unit suite + detection smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.lock
      - name: Run test suite (includes end-to-end detection smoke test)
        working-directory: harness
        run: python -m unittest discover -p "test_*.py"
      - name: Score math self-test (no model/fixture needed)
        working-directory: testing
        run: python -m unittest test_score

  # Scored tier: enforces the precision/recall floor. It needs a local model
  # runner (Ollama + GPU) and the built detection fixture, so it cannot run on a
  # stock GitHub-hosted runner. Left disabled until SESSION_4_PLAN.md T2
  # (score.py + fixture + published floor) is complete; then point it at a
  # self-hosted GPU runner and flip `if:` to a real condition.
  scored:
    name: Scored tier (precision/recall floor) [needs self-hosted GPU]
    if: ${{ false }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r harness/requirements.lock
      - name: Score against the pinned corpus and enforce the recall floor
        working-directory: testing
        run: python score.py --corpus test-target --from-cache --fail-under-recall 0.80
